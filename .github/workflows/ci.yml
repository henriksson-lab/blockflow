# Does this crate still build on the three platforms it claims to run on, and
# does its own test suite still pass?
#
# **What runs, and what deliberately does not.** `cargo test` runs the tests that
# assert; it never passes `--ignored`. That flag is the line between the two
# kinds of test this crate has, and the line is already drawn in the source: the
# 65 `#[ignore]`d tests are *measurements* — they print tables of nanoseconds per
# voxel and resident bytes — plus a handful that read a machine-local recorded
# volume or regenerate a committed file. A shared CI runner is the wrong
# instrument for every one of them.
#
# **A red run must mean the code is wrong, never that a runner was busy**, and
# that is a rule this file used to state as already true — "nothing in the crate
# asserts on a duration" — while three tests in `src/cache_tests.rs` did. One of
# them failed exactly as predicted, on macOS, at 177 ms against a 160 ms bound
# where the failure it was built to catch is twelve times the bound. `cargo test`
# runs tests in parallel and the fixtures sleep, so an oversubscribed three-core
# runner reaches those numbers by being busy.
#
# All three are gone, and the way they went is worth knowing because it is the
# pattern for the next one:
#
# * two had an exact **structural** form and did not need a clock at all — "the
#   prefetch queue had not drained when the demand read returned", and "submit
#   returned having done at most one of the 32 reads it queued", where doing the
#   IO itself would have meant all 32;
# * the latency claim that had no structural form moved to an `#[ignore]`d
#   measurement beside the other 64.
#
# What remains is one **liveness** bound — a coordinator shuts down within five
# seconds — and that is a different kind of claim: it separates "finished" from
# "hung", not "fast" from "slow", and no busy runner reaches it.
#
# **The tests that do run are not heavy, and that is measured rather than
# assumed.** With the `[profile.dev]` this crate now ships, at `--test-threads=4`
# to imitate a hosted runner:
#
# | | binaries | total wall | slowest one | peak RSS |
# |---|---|---|---|---|
# | no features | 104 | 70.6 s | 14.0 s (`barrier_migration`) | 126 MB |
# | `gui,distributed,zarr,model-segment` | 111 | 87.4 s | 15.3 s (`barrier_migration`) | 128 MB |
# | `fftw` (`fft_correlation` alone) | 1 | 0.4 s | — | 23 MB |
#
# A 16 GB runner is not troubled by 128 MB, and the whole suite is under two
# minutes. The `local_multi_node` suite — which starts real coordinator and
# worker *processes* over loopback — is 3.3 s of that and binds `:0`, never a
# fixed port, so it does not collide with anything else on the runner.
#
# **The test step is nearly free**, which is why it sits inside the build job
# rather than beside it: `cargo build --all-targets` has already compiled every
# test binary, so `cargo test` only runs them. A separate job would pay for the
# whole compile again.
#
# `build` and not `check` because the question is whether it *builds*: `check`
# stops before codegen and before the linker, and the linker is exactly what has
# something to say on a platform this crate has not been tried on — see the
# `fftw` job, whose whole failure mode is a missing `-lfftw3`.
#
# The toolchain is `stable` and not a pinned version because the floor moves and
# is not ours: `burn 0.22.0-pre.2` demands rustc **1.95** and `stardist-rs` is
# edition 2024, so an older toolchain fails at resolution with a clear message.
#
# **Lints are gated**, `-D warnings` over every target, in the `lint` job. The
# crate's exceptions to clippy are in `Cargo.toml`'s `[lints.clippy]`, each with
# the reason it is one; anything not listed there is a failure.
#
# **What is not here, and why.** The `*-cuda` features need a CUDA toolkit and a
# device, and a hosted runner has neither. Everything else in `Cargo.toml` is
# built by one of the jobs below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing test on a machine nobody can attach a debugger to is worth a
  # backtrace; `[profile.dev]` ships `line-tables-only`, so it has line numbers.
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.features.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          # The configuration everything else in `Cargo.toml` is measured
          # against: no feature at all. Tested on all three platforms, because
          # this is the one whose behaviour the rest are described relative to.
          - { name: no features, key: default, flags: "", test: everywhere }
          # `gui`, `distributed` and `model-segment` add no packages of their
          # own; `zarr` adds a C toolchain requirement through `libz-sys`, which
          # every runner has. Tested on Linux only — widening it is one word,
          # and worth doing the first time anyone runs this crate elsewhere.
          - { name: gui+distributed+zarr+model-segment, key: wide, flags: "--features gui,distributed,zarr,model-segment", test: linux }
          # The reason this workflow exists. `stardist-rs` is no longer a path on
          # one developer's machine but a git revision, so whether it builds
          # anywhere else is now a question CI can answer. Built and not tested:
          # its tests are the `model-segment` ones the row above already runs,
          # and the compile — `burn`, and a patched `candle` — is the expensive
          # part.
          - { name: stardist, key: stardist, flags: "--features stardist", test: "no" }
          # The other two model adapters, git dependencies for the same reason
          # and at the same risk. Together in one row because they share `burn`,
          # which is most of what either costs to build.
          - { name: cellpose+yolo, key: cellpose-yolo, flags: "--features cellpose,yolo", test: "no" }
    steps:
      - uses: actions/checkout@v5
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - run: rustc --version --verbose
      # **`v5` because `v4` runs on Node 20**, which the runner now forces onto
      # Node 24 and warns about on every job — "Node 20 is being deprecated" —
      # and whose bundled dependencies raise a `punycode` deprecation of their
      # own inside the tar step. `v5` is the first release on the Node 24
      # runtime; `v6` exists and is also Node 24, and both are backward
      # compatible for a workflow that passes only `path`, `key` and
      # `restore-keys`, which is every use of it here. The smaller step is taken
      # because the warning is what wanted fixing, not the version number.
      # `actions/checkout@v5` is already Node 24 and needs nothing.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No `Cargo.lock` is committed, so the key is over the manifest: the
          # cache is a warm start, not a promise of the same dependency graph.
          key: ${{ runner.os }}-cargo-${{ matrix.features.key }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.features.key }}-
      - name: Build
        run: cargo build --all-targets ${{ matrix.features.flags }}
      # `--no-fail-fast` so one broken suite does not hide the state of the other
      # hundred. No `--ignored`: see the header.
      - name: Test
        if: matrix.features.test == 'everywhere' || (matrix.features.test == 'linux' && runner.os == 'Linux')
        run: cargo test --no-fail-fast ${{ matrix.features.flags }}

  # **The lint gate.** `-D warnings` over every target, which is why the crate's
  # exceptions live in `Cargo.toml`'s `[lints.clippy]` rather than in `lib.rs`:
  # a crate-root `#![allow]` covers the library and not the integration tests,
  # and the tests are two thirds of this repository, so gating on the library
  # alone would be a gate that says nothing about most of the code.
  #
  # Linux only — a lint is not a platform — and beside `cargo fmt --check`,
  # because the two fail for the same reason and a contributor wants both
  # answers in one job rather than one after the other.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: rustc --version --verbose
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # `fftw` links the system `libfftw3`, and when there is none the failure is a
  # link error rather than a fallback to the portable backend — deliberately, and
  # the `fftw-sys` block in `Cargo.toml` says why. Linux and macOS can install
  # the library in one line; Windows has no such line, which is why this job has
  # two platforms where the one above has three.
  fftw:
    name: fftw (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install FFTW (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - name: Install FFTW (macOS)
        if: runner.os == 'macOS'
        # Homebrew is not on the linker's default search path on Apple silicon,
        # and `fftw-sys` with `system` has no build script to add it.
        run: |
          brew install fftw
          echo "RUSTFLAGS=-L $(brew --prefix fftw)/lib" >> "$GITHUB_ENV"
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - run: rustc --version --verbose
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-fftw-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-fftw-
      - run: cargo build --all-targets --features fftw
      # This is the configuration in which `tests/fft_correlation.rs` compares
      # the two backends *in one process*, which is the only way that comparison
      # is worth anything. 22 assertions, 0.4 s; the timing half of that file is
      # `#[ignore]`d and stays that way here.
      - run: cargo test --no-fail-fast --features fftw

  # The documentation is this crate's design record, so a link in it that no
  # longer resolves is drift. `src/lib.rs` denies `broken_intra_doc_links`
  # crate-wide, which catches it wherever docs are built; this job is what makes
  # "wherever" include every push.
  #
  # Default features only, deliberately: the deny attribute travels with the
  # crate, so a developer running `cargo doc --features …` gets the same failure
  # without CI paying to compile `burn` a fifth time.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-docs-
      - run: cargo doc --no-deps
