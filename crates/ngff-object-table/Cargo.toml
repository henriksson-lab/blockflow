[package]
name = "ngff-object-table"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Typed, spatially indexed Zarr object tables for bioimaging"

[dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zarrs = { version = "0.23.13", default-features = false, features = [
    "filesystem",
    "gzip",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ngff-object-table-convert"
path = "src/bin/convert_csv.rs"
