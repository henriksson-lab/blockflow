[package]
name = "blockflow-vessel-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vessel segmentation, skeleton-to-graph extraction, graph cleanup, radii, artery/vein classification and branch density."

[dependencies]
blockflow = { path = "../..", features = ["zarr"] }
atlas-regions = { path = "../../crates/atlas-regions", features = ["zarr"] }
blockflow-atlas-registration = { path = "../atlas-registration" }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zarrs = "0.23.13"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vessel-graph"
path = "src/main.rs"

# The same exception the root crate makes, for the same reason: a loop body here
# indexes several parallel `[_; 3]` arrays by one axis, which an index says and
# a three-way zip does not.
[lints.clippy]
needless_range_loop = "allow"
