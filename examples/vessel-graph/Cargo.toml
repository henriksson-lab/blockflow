[package]
name = "blockflow-vessel-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vessel segmentation, skeleton-to-graph extraction, graph cleanup, radii, artery/vein classification and branch density."

[features]
default = []
# The reference's deep vessel filling CNN (`segment::deep_fill`), on burn's CPU
# backend. Off by default so the default build, and CI's `members` job, do not
# compile burn.
deep-fill = ["dep:burn"]
# The same network on a GPU (`segment::deep_fill::gpu`), chosen at run time
# with `--deep-fill-device` (default auto: the GPU when one is reachable). The
# device and its memory budget are `blockflow::gpu`'s (`BLOCKFLOW_GPU=off`,
# `BLOCKFLOW_GPU_MEMORY`). `deep-fill-gpu` is the shared code and needs one of
# the two runtimes; CUDA is the one measured. Both build without a CUDA
# toolkit or a GPU (the driver and NVRTC are loaded at run time).
deep-fill-gpu = ["deep-fill", "blockflow/gpu"]
deep-fill-cuda = ["deep-fill-gpu", "burn/cuda", "blockflow/gpu-cuda"]
deep-fill-wgpu = ["deep-fill-gpu", "burn/wgpu", "blockflow/gpu-wgpu"]

[dependencies]
blockflow = { path = "../..", features = ["zarr"] }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "flex"], optional = true }
atlas-regions = { path = "../../crates/atlas-regions", features = ["zarr"] }
blockflow-atlas-registration = { path = "../atlas-registration" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ndarray = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zarrs = "0.23.13"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vessel-graph"
path = "src/main.rs"

# The same exception the root crate makes, for the same reason: a loop body here
# indexes several parallel `[_; 3]` arrays by one axis, which an index says and
# a three-way zip does not.
[lints.clippy]
needless_range_loop = "allow"
