[package]
name = "blockflow-stardist-ome-zarr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cuda = ["blockflow/stardist-candle-cuda"]

[dependencies]
blockflow = { path = "../..", features = ["zarr", "stardist"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "stardist-ome-zarr"
path = "src/main.rs"
