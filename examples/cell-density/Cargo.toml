[package]
name = "blockflow-cell-density"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cell detection in whole-organ light-sheet volumes, per-region counts and density maps, written as an NGFF object table."

[dependencies]
atlas-regions = { path = "../../crates/atlas-regions", features = ["zarr"] }
blockflow-atlas-registration = { path = "../atlas-registration" }
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
rayon = "1"
serde_json = "1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[lib]
name = "cell_density"
path = "src/lib.rs"

[[bin]]
name = "cell-density"
path = "src/main.rs"

# The same exception the root crate makes, for the same reason: a loop body here
# indexes several parallel `[_; 3]` arrays by one axis, which an index says and
# a three-way zip does not.
[lints.clippy]
needless_range_loop = "allow"
# And the root crate's NaN rule: `!(x >= min)` rejects a NaN where `x < min`
# would let it through.
neg_cmp_op_on_partial_ord = "allow"
