# Narrow follow-up to dapi_sweep.yaml. Frozen BatchNorm was decisively better
# in the first sweep, so this compares how much of the transferred detector to
# train and whether weight decay helps at the two retained learning rates.
rounds:
  - epochs: 2
    keep: 4
  - epochs: 3
    keep: 2
  - epochs: 5
    keep: 1

max_lr: [0.000005, 0.00001]
min_lr_ratio: [0.1]
weight_decay: [0.0, 0.0005]
gradient_clip: [10.0]
geometry: [d4]
trainable_layers: [head-and-neck, head-only]
batch_norm: [frozen]
