[package]
name = "blockflow-yolo-ome-zarr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cuda = ["blockflow/yolo-cuda"]
libtorch = ["blockflow/yolo-libtorch", "yolov11/libtorch"]

[dependencies]
anyhow = "1"
blockflow = { path = "../..", features = ["yolo"] }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
ngff-object-table = { path = "../../crates/ngff-object-table" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
yolov11 = { git = "https://github.com/henriksson-lab/YOLOv11-rs.git", rev = "697198bffa4a7fc6bdc302d54db98dd5092f9ef1" }

[[bin]]
name = "yolo-ome-zarr"
path = "src/main.rs"

[[bin]]
name = "yolo-dapi-train"
path = "src/bin/train_dapi.rs"
