[package]
name = "blockflow-yolo-ome-zarr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cuda = ["blockflow/yolo-cuda"]
libtorch = ["blockflow/yolo-libtorch", "yolov11/libtorch"]

[dependencies]
anyhow = "1"
blockflow = { path = "../..", features = ["yolo"] }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
yolov11 = { path = "../../../YOLOv11-rs" }

[[bin]]
name = "yolo-ome-zarr"
path = "src/main.rs"

[[bin]]
name = "yolo-dapi-train"
path = "src/bin/train_dapi.rs"
