[package]
name = "blockflow-yolo-ome-zarr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cuda = ["blockflow/yolo-cuda"]
libtorch = ["blockflow/yolo-libtorch"]

[dependencies]
anyhow = "1"
blockflow = { path = "../..", features = ["yolo"] }
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "yolo-ome-zarr"
path = "src/main.rs"
