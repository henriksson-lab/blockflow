[package]
name = "blockflow-object-3d-measurement"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
tempfile = "3"
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
serde_json = "1"

[[bin]]
name = "object-3d-measurement"
path = "src/bin/object_3d_measurement.rs"
