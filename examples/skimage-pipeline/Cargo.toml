[package]
name = "blockflow-skimage-pipeline"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
tempfile = "3"
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
ndarray = "0.17"
serde_json = "1"

[[bin]]
name = "skimage-pipeline"
path = "src/bin/skimage_pipeline.rs"

[[bin]]
name = "skimage-compare"
path = "src/bin/skimage_compare.rs"
