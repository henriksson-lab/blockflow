[package]
name = "blockflow-tile-stitching"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Tile stitching: layout fit, rigid and per-slice alignment, and fusion of overlapping light-sheet tiles into one OME-Zarr volume."

[dependencies]
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tile_stitching"
path = "src/lib.rs"

[[bin]]
name = "tile-stitching"
path = "src/main.rs"
