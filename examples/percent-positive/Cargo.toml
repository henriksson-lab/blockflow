[package]
name = "blockflow-percent-positive"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
serde_json = "1"

[[bin]]
name = "percent-positive"
path = "src/bin/percent_positive.rs"
