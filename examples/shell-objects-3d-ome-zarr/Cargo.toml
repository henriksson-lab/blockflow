[package]
name = "blockflow-shell-objects-3d-ome-zarr"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
blockflow = { path = "../..", features = ["zarr"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ndarray = "0.17"
rayon = "1"
serde_json = "1"

[[bin]]
name = "shell-objects-3d-ome-zarr"
path = "src/main.rs"
