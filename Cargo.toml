# Its own workspace: this crate is a sibling of `clearmap-rs`, not a member of
# it. The dependency direction is one-way and enforced here — `blockflow` has no
# `clearmap-rs` dependency and must never acquire one.
[workspace]

[package]
name = "blockflow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Out-of-core block processing: op chains, reach-derived valid regions, block decomposition, a task DAG, a shared chunk cache and a hint-driven prefetcher."

[dependencies]
# Deliberately short. Every entry here is a dependency the *framework* needs;
# anything an individual op needs belongs in the crate that supplies the op.
# The encoded tier needs *a* compressor. Which one is a parameter (`cache::Codec`);
# this is the built-in default, chosen for being pure Rust and unsurprising.
flate2 = "1"
ndarray = "0.17"
rayon = "1"
serde_json = "1"
# `ops::fft` only, and the one exception to the rule stated at the top of this
# block: an FFT is not the framework's own machinery, it is what one op needs.
# It is here rather than in a consumer because the rule that decides *which*
# crate is the rule this block already states — anything an individual op needs
# belongs in the crate that supplies the op — and a discrete Fourier transform is
# general image processing rather than domain knowledge. The consumer's own
# `Cargo.toml` says it adds no packages at all, so "put it in the application"
# was never an option that existed.
#
# Two crates, and `realfft` is not redundant with `rustfft`: the input is real,
# and a real-input transform is about **1.6x** the throughput of the complex one at
# these sizes — measured at `128 x 1350`, forward `1.09 ms` against `1.72 ms`.
# `realfft` depends on `rustfft` and nothing else, so it is one package for that.
#
# **Not behind a feature, and the numbers are why.** Measured as
# `cargo tree -e normal --prefix none | sed 's/ (\*)$//' | sort -u | wc -l`,
# which is stated because the older figures in the `zarr` note below were taken a
# different way and the two are not comparable. The two crates take the graph from
# **24 packages to 29** — the five are `rustfft`, `realfft`, `primal-check`,
# `strength_reduce` and `transpose`; `num-complex`, `num-integer`, `num-traits`
# and `autocfg` were all already there under `ndarray` — add **no build script**
# (`-e normal,build` goes 25 to 30, and the one build-script crate in it,
# `autocfg`, was already present), need no C toolchain, and cost **4.5 s** of
# release compile time, of which `rustfft` is 3.7 s.
#
# That is not the `zarrs` situation — a hundred-odd packages, a `libz-sys` build
# script and a C compiler — which is what a feature gate is for here. And a
# feature would cost something real in exchange: an op behind a `cfg` is an op the
# default `cargo test` does not compile, and this crate's whole position is that
# the no-feature configuration is the one everything else is measured against.
#
# **Three alternatives were measured rather than argued about.** All at the
# padded geometry `ops::fft` actually chooses for the consumer's case,
# `128 x 1350`, `--release`, one thread, best of 50, forward transform:
#
# | | forward | why not |
# |---|---|---|
# | `rustfft` + `realfft` | `1.09 ms` | taken |
# | `ndrustfft` 0.6.2 | `0.98 ms` | **a wrapper over `rustfft`** — its dependency list is `rustfft`, `realfft`, `rustdct`, `ndarray`, `num-traits` — so it cannot be faster at the transform, and the measurement says so: 10% on a hand-rolled lane loop that was worth tuning anyway (see `LANE_BLOCK`). It is also on `ndarray ^0.17` against this crate's 0.16, which is a second `ndarray` and a **copy at every boundary crossing** for a kernel whose reason to exist is throughput. 10% does not buy that. *If this crate moves to 0.17 the type-level half of that objection goes away and only the wrapper fact remains, which is still enough.* |
# | `fftw` 0.8 (FFTW 3.3.8) | `0.87 ms` | **1.25x**, for a C library. It links a system `libfftw3` when one is installed — it was on the machine this was measured on — and otherwise builds FFTW from source, so a consumer without the system library gets a C toolchain requirement and a multi-minute first build out of a dependency they did not ask for. It also pulls a third `ndarray` (0.15) and a proc-macro chain for its error type. `FFTW_MEASURE` costs 0.4-1.1 s of planning and bought 0-25% over `FFTW_ESTIMATE` here, so the gap does not widen. |
#
# The measurement that mattered was **not** the library. Choosing the padded
# length well — `128 x 1350` rather than the consumer's own `157 x 1335`, where
# `157` is prime — is worth **5.9x** on the same transform with the same crate,
# and **4.6x** on a whole landscape end to end, which is more than the whole
# spread of the table above put together. `ops::fft`'s header has that table and
# the rule that produces it.
#
# Two constraints were lifted while this was being chosen and neither changed the
# answer, so both are recorded rather than left implicit. A **second `ndarray`**
# was allowed: that removes half the `ndrustfft` objection and leaves the wrapper
# fact, which is still enough at 10%. (The question then went away entirely — all
# three crates moved to 0.17, so `ndrustfft` would no longer be a second
# `ndarray` at all, and the wrapper fact is the whole of what is left.)
# **Licensing** was ruled out as a criterion:
# FFTW is GPL-2.0-or-later against this crate's MIT, and that is *not* why it was
# declined — the reason is the row above, a C library and a source build for a
# consumer who did not ask for one, in exchange for 1.25x.
rustfft = "6.4.1"
realfft = "3.5.0"
# The `fftw` feature only, and the two crates above are **not** conditional on
# it: with
# `fftw` on, both backends are compiled and `ops::fft::TransformBackend` selects
# between them. That is deliberate. A parity test that could only compare the two
# across two processes would be comparing numbers somebody copied; compiled
# together, `tests/fft_correlation.rs` measures the agreement between backends in
# one run, on the fixtures the acceptance bar already uses, and prints it.
#
# **`fftw-sys` and not `fftw`.** The safe wrapper cannot express what this crate
# needs from FFTW. Its `Plan` is `Send` but not `Sync` and its execute methods
# take `&mut self`, so a plan cannot live behind an `Arc` — and sharing one plan
# across cloned working sets is exactly what `RealTransform2::clone` promises and
# what FFTW's own thread-safety rule permits (the new-array execute functions are
# re-entrant; nothing else in FFTW is). Cloning would have to re-plan instead,
# putting the one operation FFTW cannot do concurrently inside whatever loop the
# caller cloned for. The sys crate is also the cheaper half of the same project:
#
# | | packages | what it adds |
# |---|---|---|
# | `fftw-sys` 0.8, `system` | **31** | `fftw-sys` and `libc` |
# | `fftw` 0.8, `system` | 41 | those two, plus `fftw`, `bitflags`, `lazy_static`, `thiserror` with its proc-macro chain (`thiserror-impl`, `proc-macro2`, `quote`, `syn`, `unicode-ident`), and **a second `ndarray`** at 0.15.6 |
#
# Measured the way the counts above this block are, on two probe crates
# identical but for that one line, and the `fftw-sys` one comes out at exactly
# the 31 this crate has with `--features fftw`.
#
# `src/ops/fft.rs`'s `fftw_backend` module is the wrapper this needs instead:
# two plans, one lock, one RAII buffer type, and every `unsafe` block with the
# invariant it relies on written above it.
#
# **`system` and not `source`, and this is the load-bearing flag.** `fftw-sys`
# defaults to `source`, which downloads and builds FFTW with a C toolchain — a
# multi-minute first build, and a build script, for a consumer who asked for a
# feature flag. `default-features = false` with `system` back on has **no build
# script at all**: it is a `#[link(name = "fftw3")]` against the library the
# machine already has. `libc` and `fftw-sys` together compile in **2 s**
# (`--release`, measured on a fresh target directory) because they are bindings
# and nothing else.
#
# The failure mode when there is no `libfftw3` is therefore a **link error at
# build time**, not a silent fallback to the portable backend. On this toolchain
# it reads
#
# ```text
# error: linking with `cc` failed: exit status: 1
#   = note: rust-lld: error: unable to find library -lfftw3
# ```
#
# — demonstrated by linking a `#[link]` name that does not exist rather than by
# removing the machine's FFTW. That is the right way round: a feature whose whole
# purpose is to change which library does the arithmetic must not quietly decline
# to do it. What it costs is that the message names the linker's problem rather
# than cargo's, which is why it is written down here.
#
# **What it is worth, measured on this machine, and the answer is "nothing"**
# (FFTW 3.3.8, `--release`, one thread, best of 50 on the transform and best of
# 20 on the landscape, by `the_backends_are_measured_against_each_other` in
# `tests/fft_correlation.rs`, best over seven repetitions of the whole test):
#
# | | `128 x 1350`, the shape the padding rule chooses | `157 x 1335`, the shape before it |
# |---|---|---|
# | forward `r2c`, portable | **`0.816 ms`** | **`5.851 ms`** |
# | forward `r2c`, FFTW | `0.841 ms` | `6.834 ms` |
# | | **0.97x — FFTW is slower** | **0.86x — FFTW is slower** |
# | a whole landscape, portable | **`4.097 ms`** | |
# | a whole landscape, FFTW | `4.262 ms` | |
# | | **0.96x — FFTW is slower** | |
#
# **Read that table before believing any other.** On a loaded machine the same
# test put the first row at `1.02 ms` against `0.87 ms` — a `1.17x` win for FFTW —
# which is where the `1.25x` this decision was first argued from came from. It is
# contention, not throughput: with the machine quiet the portable path drops to
# `0.816 ms` and FFTW does not follow, and it is *consistently* a few percent
# behind across every repetition rather than ahead on some.
#
# **Why the library that is faster loses anyway.** FFTW's raw two-dimensional
# `r2c` really is quicker — about `0.72 ms` of the `0.841 ms` above. The rest is a
# copy, and it is not an implementation detail that could be tidied away: a plan
# may only be executed against buffers of the alignment it was planned with, so
# the half-spectrum has to move between the caller's `ndarray` and an
# `fftw_alloc` buffer at `0.118 ms` a time, three times per landscape (two
# forwards and an inverse). A backend that owned the caller's spectrum would keep
# that `1.13x`; `Spectrum` is a public `ndarray` type, and the alternative —
# checking the caller's alignment and executing in place when it happens to match
# — would make the answer depend on where malloc put a buffer, which is precisely
# the determinism `a_cloned_plan_computes_the_same_answer_from_another_thread`
# asserts.
#
# So the ceiling on this feature, if that copy were ever removed, is about `1.1x`
# on a transform — against the `5.9x` that choosing the padded length well is
# worth on the same transform and the `6.4x` that threads over plane pairs are
# worth, neither of which it changes. **As it stands the feature is a small loss
# at every geometry measured, and the recommendation that ships with it is to
# leave it off.**
#
# `FFTW_MEASURE` does not change that: it costs `0.45-0.87 s` of planning and
# bought `0-1%` here, and it would also make two clones of one plan disagree in
# the last place, which the bit-identity test above asserts they do not.
# `FFTW_ESTIMATE` it is — and even that plans a `128 x 1350` transform in
# `11-13 ms` against `rustfft`'s `2.2 ms`, so the one thing the FFTW backend is
# reliably worse at is the thing this API is shaped to do once.
#
# Licensing is **not** a criterion, and the paragraph above already settled that
# when FFTW was declined as the default. FFTW being GPL-2.0-or-later against this
# crate's MIT is a fact a consumer who turns the feature on has decided about; it
# is not the reason the flag is off, and the row above is.
fftw-sys = { version = "0.8", optional = true, default-features = false, features = [
    "system",
] }
# The `zarr` feature only. The one storage backend this crate carries, and the
# only dependency here that is not the framework's own machinery: a level has to
# live somewhere, and everything before it was proven against arrays in memory.
#
# `default-features = false` and two features back on, deliberately. The
# defaults add blosc (which builds C), zstd, sharding, transpose and crc32c, none
# of which `zarr_env` asks for — it reads and writes through the element API
# (`Vec<T>`).
#
# They used to add **a second `ndarray`** as well, and that was the sharpest of
# these reasons: `zarrs` was on 0.17 against this crate's 0.16, so its ndarray
# bridge would have handed back arrays of a type nothing here could hold. **That
# is no longer true** — all three crates and `zarrs` are on 0.17 together, so the
# bridge is now merely unused rather than unusable. The flag stays off for the
# other five, which are unchanged.
#
# The two that are asked for:
#
# * `filesystem` — the store. A level has to live somewhere.
# * `gzip` — the codec `zarr_env::Compression` offers, and **it costs nothing**.
#   `zarrs`'s `gzip` feature is exactly `dep:flate2`, and `flate2` is already a
#   dependency of this crate for `cache::DeflateCodec`, at the same major
#   version. The package count with `--features zarr` is therefore unchanged at
#   156, no build script is added, and the incremental build cost is the codec
#   module itself. That — rather than "gzip is the best compressor" — is why the
#   one compressor this environment offers is gzip: `zstd` (3 packages, a C
#   build), `blosc` (2 packages, a C build) and `bz2` would each have to buy
#   their ratio, and the ratio that matters most here is on `bool` data where
#   deflate is already near the ceiling.
zarrs = { version = "0.23.13", optional = true, default-features = false, features = [
    "filesystem",
    "gzip",
] }

[features]
# The progress view: an HTTP surface and the browser page's asset directory.
# Off by default, and off is the configuration everything else is measured
# against: with `gui` disabled this crate compiles, tests and resolves exactly as
# it did before the feature existed.
#
# **It has no dependencies at all, and that is a change with a measurement
# behind it rather than a tidying.** This feature used to pull `tiny_http`, and
# was the last thing in this file that did after `distributed` stopped. Its
# `TaskPool::spawn` creates a thread only when it observes none waiting, and its
# connection task never returns while the connection lives — so connections
# arriving together all read the same threads as free, and the surplus queues
# behind a task that never finishes. The pool's floor is four threads. A browser
# holding a page of three files and two poll intervals goes past four without
# trying, and measured here, in bursts of simultaneous keep-alive connections
# held open, twenty bursts a row: nothing lost at two, three or four; **fourteen
# of twenty bursts left a connection that was never read at all at five**;
# sixteen of twenty at eight. A request that is never read does not fail, it
# hangs, and the view of a healthy run freezes with it. `src/http.rs` accepts and
# reads its own connections and `gui` is now a feature over this crate's own
# code.
#
# The package graph with `--features gui` was **34** and is **29**, which is
# exactly what it is with no feature at all — measured the way the `fftw` block
# above measures, `cargo tree -e normal --prefix none | sed 's/ (\*)$//' | sort
# -u | wc -l`. The five were `tiny_http`, `ascii`, `chunked_transfer`,
# `httpdate` and `log`, which is `tiny_http`'s whole subtree: nothing it brought
# was shared with anything else here.
gui = []
# A Zarr v3 `Environment`: levels as arrays on a filesystem store. Off by
# default, and off is the configuration everything else is measured against —
# with `zarr` disabled this crate compiles and tests exactly as it did before the
# feature existed, and a consumer builds none of it.
#
# It is a feature rather than a plain dependency because of what it costs, and
# the number is stated rather than felt: this crate's dependency graph is **38
# packages** without it and **156 with**, and `zarrs` carries a build script
# with a `libz-sys` build-dependency, so enabling it also asks for a C toolchain.
# That is a fair price for reading and writing real arrays and an unreasonable
# one for a framework that is only counting bytes or only holding them in memory
# — and which of those a caller is doing is the caller's business, not this
# file's. `default-features = false` on `zarrs` is part of the same accounting:
# only its filesystem store is asked for, not blosc, zstd, sharding, transpose,
# crc32c or its own (different, second) `ndarray`.
zarr = ["dep:zarrs"]
# `ops::fft` on the system's FFTW 3 instead of `rustfft` + `realfft`. Off by
# default, and off is the configuration everything else is measured against: with
# `fftw` disabled the package graph is **29**, exactly what it was before this
# feature existed, no build script appears, and every transform in the crate is
# the pure-Rust one. On, the graph is **31** and both backends are compiled, so
# `ops::fft::TransformBackend` — and the parity tests — can name either.
#
# It is a feature and not a swap because on this machine it is **slower at every
# geometry measured** — `0.97x` on the forward transform at the padded shape,
# `0.86x` at the shape before the padding rule, `0.96x` on a whole landscape — in
# exchange for a C library, a link-time dependency on `libfftw3` and a GPL
# transitive obligation. The dependency block above has the measurements, why the
# faster library still loses, and the failure mode when `libfftw3` is missing.
fftw = ["dep:fftw-sys"]
# The distribution **server** and the three binaries. Deliberately narrow: the
# protocol, the coordinator's whole state machine, the handout policy, the cache
# model, the rendezvous backends, the HTTP client and the worker loop compile and
# are tested with no feature at all.
#
# **It no longer pulls `tiny_http`, and the reason is a measurement rather than
# tidying.** This feature used to serve over that crate. Its `TaskPool::spawn`
# creates a thread only when it observes none waiting, and our connection task
# never returns while the connection lives — so connections arriving together
# all read the same threads as free, and the surplus queues behind a task that
# never finishes. Under permanent connections a queued connection is read when
# some *other* connection closes, which means when the job ends: a worker that
# had joined and asked was served nothing for a whole run. With a detector in
# place that happened in 22 of 40 runs, and it only ever surfaced as a flaky
# test when it struck a worker some assertion depended on. `distributed` now
# accepts and reads its own connections; see `src/distributed/server.rs`.
distributed = []

# The browser half lives in `webui/` and is a separate crate with its own
# workspace, compiled to WebAssembly by `trunk`, not by cargo. It is not
# declared here because nothing in this crate links against it — the server
# reads the built files off disk, and says how to build them when they are
# missing.
[[bin]]
name = "block_gui"
path = "src/bin/block_gui.rs"
required-features = ["gui"]

# The coordinator is its own program, always — never "rank 0 behaves
# differently". The worker only ever connects, pulls, executes and reports, so
# there is one worker binary whatever the environment. `blockflow-local` starts
# both, N times, on one machine.
[[bin]]
name = "blockflow-coordinator"
path = "src/bin/blockflow_coordinator.rs"
required-features = ["distributed"]

[[bin]]
name = "blockflow-worker"
path = "src/bin/blockflow_worker.rs"
required-features = ["distributed"]

[[bin]]
name = "blockflow-local"
path = "src/bin/blockflow_local.rs"
required-features = ["distributed"]
